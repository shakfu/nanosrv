name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang make
      # make build / make test drive the build through uv (uv sync), so uv must
      # be on PATH; it provisions its own Python, so no separate setup-python.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build
        run: make build
      - name: Test
        run: make test
