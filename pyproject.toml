[project]
name = "nanosrv"
version = "0.2.0"
description = "An embedded server wrapped with nanobind"
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["nanobind", "python", "extension"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
    "twine>=6.2.0",
]

[build-system]
requires = ["scikit-build-core>=0.8", "nanobind"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/nanosrv"]
cmake.args = []
cmake.define = {}
cmake.build-type = "Release"
cmake.source-dir = "."
sdist.include = []
sdist.exclude = []
wheel.exclude = []

[tool.mypy]
# nanosrv._core (the compiled nanobind extension) now ships generated stubs in
# src/nanosrv/_core.pyi, so the Typing :: Typed classifier is backed by real
# signatures and the previous ignore_missing_imports override for that module
# is gone. Regenerate the stubs after changing the bindings with:
#   uv run --with nanobind python -m nanobind.stubgen -m nanosrv._core \
#       -o src/nanosrv/_core.pyi

